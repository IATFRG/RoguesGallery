<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Group Profiles</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="site-header"><div class="container header-content"><div><a href="index.html" class="back-link">← Back to Directory</a><h1 id="groupTitle">Group Profiles</h1></div><button id="logoutButton" class="button secondary" type="button">Log Out</button></div></header>
<main class="container">
<section class="panel"><h2>Search Profiles</h2><div class="filter-grid"><div class="form-group"><label for="groupSearch">Search by name</label><input type="search" id="groupSearch" placeholder="Enter a name"></div><div class="form-group"><label for="groupRankFilter">Filter by role</label><select id="groupRankFilter"><option value="">All Roles</option><option>Leader</option><option>Sub Leader</option><option>Enforcer</option><option>Shooter</option><option>Soldier</option><option>Runner</option><option>Associate</option></select></div></div></section>
<section aria-labelledby="profilesHeading"><h2 id="profilesHeading">Profiles</h2><div id="emptyMessage" class="empty-message">No profiles found in this group.</div><div id="profiles" class="profiles-grid" aria-live="polite"></div></section>
</main><script src="app.js"></script></body></html>
