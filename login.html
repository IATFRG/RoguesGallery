<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | Rogue Gallery Directory</title><link rel="stylesheet" href="styles.css"></head>
<body class="login-page"><main class="login-container"><section class="login-panel"><img src="logo.png" alt="Rogue Gallery Directory logo" class="login-image"><div class="login-brand">ROGUE GALLERY <strong>DIRECTORY</strong></div><h1>Welcome Back</h1><p>Please enter your username and password to continue.</p>
<form id="loginForm"><div class="form-group"><label for="username">Username</label><input type="text" id="username" required></div><div class="form-group"><label for="password">Password</label><input type="password" id="password" required></div><button class="primary-button full-width" type="submit">Sign In</button></form><div id="loginStatus" role="status"></div><p class="login-note">Demo version: authentication is handled locally in the browser.</p></section></main><script src="app.js"></script></body></html>
