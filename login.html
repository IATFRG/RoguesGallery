<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | Rogue Gallery</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#071d3a"><link rel="apple-touch-icon" href="icons/icon-192.png"></head><body class="login-page"><main class="login-container"><section class="login-panel"><img src="icons/logo.png" alt="Rogue Gallery icon" class="login-image" onerror="this.style.display='none'"><div class="login-brand">ROGUE GALLERY</div><h1>Welcome Back</h1><p>Sign in securely to access your cloud directory.</p><form id="loginForm"><div class="form-group"><label for="email">Email address</label><input type="email" id="email" autocomplete="email" required></div><div class="form-group"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div><button class="primary-button full-width" type="submit">Sign In</button></form><div id="loginStatus" role="status"></div><p class="login-note">New here? <a href="register.html">Create a secure account</a>.</p></section></main><script type="module" src="app.js"></script></body></html>
