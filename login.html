<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Directory Login</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">

  <main class="login-container">

    <section class="panel login-panel" aria-labelledby="loginHeading">

      <!-- LOGIN IMAGE / LOGO -->
      <img
        src="logo.png"
        alt="Profile Directory logo"
        class="login-image"
      >

      <h1 id="loginHeading">Profile Directory</h1>

      <p>Please enter your username and password to continue.</p>


      <form id="loginForm">

        <!-- USERNAME -->
        <div class="form-group">

          <label for="username">Username</label>

          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
          >

        </div>


        <!-- PASSWORD -->
        <div class="form-group">

          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          class="button primary"
        >
          Sign In
        </button>

      </form>


      <div
        id="loginStatus"
        class="status"
        role="status"
        aria-live="polite"
      ></div>

    </section>

  </main>


  <script src="app.js"></script>

</body>
</html>
