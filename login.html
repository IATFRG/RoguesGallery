<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Profile Directory</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
<main class="login-container">
<section class="login-panel">
<img src="logo.png" alt="Profile Directory logo" class="login-image">
<h1>Welcome Back</h1>
<p>Sign in to access the Profile Directory.</p>
<form id="loginForm">
<div class="form-group"><label for="username">Username</label><input id="username" type="text" required autocomplete="username"></div>
<div class="form-group"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div>
<button type="submit" class="button primary">Sign In</button>
<div id="loginStatus" class="status" role="status" aria-live="polite"></div>
</form>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
