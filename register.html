<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | Rogue Gallery</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#071d3a"><link rel="apple-touch-icon" href="icons/icon-192.png"></head><body class="login-page"><main class="login-container"><section class="login-panel"><img src="icons/icon-512.png" alt="Rogue Gallery icon" class="login-image" onerror="this.style.display='none'"><div class="login-brand">ROGUE GALLERY</div><h1>Create Account</h1><p>Create your secure directory account.</p><form id="registerForm"><div class="form-group"><label for="officerName">Officer Name</label><input type="text" id="officerName" autocomplete="name" maxlength="80" required></div><div class="form-group"><label for="email">Email address</label><input type="email" id="email" autocomplete="email" required></div><div class="form-group"><label for="password">Password</label><input type="password" id="password" autocomplete="new-password" minlength="6" required></div><div class="form-group"><label for="confirmPassword">Confirm password</label><input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required></div><details class="admin-setup"><summary>Initial Administrator Setup</summary><p>Only use this during the one-time first administrator registration. Leave blank for a normal account.</p><div class="form-group"><label for="adminSetupCode">Secret administrator setup code</label><input type="password" id="adminSetupCode" autocomplete="off"></div></details><button class="primary-button full-width" type="submit">Create Account</button></form><div id="registerStatus" role="status"></div><p class="login-note">Already have an account? <a href="login.html">Sign in</a>.</p></section></main><script type="module" src="app.js"></script></body></html>
