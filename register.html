<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | Rogue Gallery Directory</title><link rel="stylesheet" href="styles.css"></head><body class="login-page"><main class="login-container"><section class="login-panel"><img src="logo.png" alt="Rogue Gallery Directory logo" class="login-image" onerror="this.style.display='none'"><div class="login-brand">ROGUE GALLERY <strong>DIRECTORY</strong></div><h1>Create Account</h1><p>Create a secure account for your cloud directory.</p><form id="registerForm"><div class="form-group"><label for="email">Email address</label><input type="email" id="email" autocomplete="email" required></div><div class="form-group"><label for="password">Password</label><input type="password" id="password" autocomplete="new-password" minlength="6" required></div><div class="form-group"><label for="confirmPassword">Confirm password</label><input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required></div><button class="primary-button full-width" type="submit">Create Account</button></form><div id="registerStatus" role="status"></div><p class="login-note">Already have an account? <a href="login.html">Sign in</a>.</p></section></main><script type="module" src="app.js"></script></body></html>
