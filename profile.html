<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile Details | Rogue Gallery</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#071d3a"><link rel="apple-touch-icon" href="icons/icon-192.png"></head><body>
<header class="top-header"><div class="brand"><div class="brand-mark"><img src="icons/header-logo.png" alt="Rogue Gallery logo"></div><span>ROGUE GALLERY</span></div><div class="header-account"><div><strong id="officerDisplay">Loading…</strong><small id="roleDisplay"></small></div><a id="installButton" class="install-button" href="https://drive.google.com/uc?export=download&id=1Qmgwc3Z-UFRXKoBdgAqP0zPgCuMgeAVu" target="_blank" rel="noopener">Install App</a><button id="logoutButton" class="logout-button" type="button">Log Out</button></div></header>
<div class="app-layout"><aside class="sidebar"><nav><a class="nav-item" href="index.html">⌂ <span>Dashboard</span></a><details class="gang-menu"><summary class="nav-item gang-summary">♛ <span>Browse Gangs</span><span class="gang-chevron">▾</span></summary><div id="gangNavigation" class="gang-dropdown"></div></details></nav></aside>
<main class="main-content profile-detail-main"><section class="profile-detail-shell"><div class="profile-detail-toolbar"><button id="backButton" class="back-link" type="button">← <span>Back</span></button><div><h1>Profile Details</h1><p id="detailGang"></p></div></div>
<div class="profile-hero"><div class="detail-photo-wrap"><img id="detailPhoto" alt="Profile photo"></div><div class="detail-name-block"><h2 id="detailName"></h2><p id="detailDob"></p><p id="detailAddress" class="detail-address"></p></div><div class="detail-rank" id="detailRank"></div></div>
<section class="detail-section"><div class="detail-section-title">⚠ <h3>Cautioned</h3></div><div id="detailCautions" class="caution-list"></div></section>
<section class="detail-section notes-section"><div class="detail-section-title">▤ <h3>Notes</h3></div><textarea id="detailNotes" maxlength="255" placeholder="Enter notes here... (max 255 characters)"></textarea><div class="notes-counter" id="notesCounter">0 / 255</div></section>
<div id="detailEditHint" class="detail-edit-hint" hidden>You're editing this profile. Caution selections and notes can be changed below.</div><div id="detailStatus" role="status"></div>
<div class="detail-actions"><button id="detailEditButton" class="primary-button" type="button">✎ Edit</button><button id="detailSaveButton" class="primary-button" type="button" hidden>Save Changes</button><button id="detailCancelButton" class="secondary-button" type="button" hidden>Cancel</button><button id="detailPermissionsButton" class="secondary-button" type="button" hidden>Permissions</button><button id="detailDeleteButton" class="danger-button" type="button" hidden>🗑 Delete</button></div>
</section></main></div><script type="module" src="app.js"></script></body></html>
